version: '3.8'

services:
  recommendation-service:
    build: .
    container_name: recommendation-microservice-prod
    ports:
      - "8000:8000"
    environment:
      - DB_URL=${DB_URL}
      - RETRAIN_INTERVAL_HOURS=${RETRAIN_INTERVAL_HOURS:-24}
    volumes:
      - model_data:/app/model_data
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/recommendations/1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - recommendation-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  recommendation-scheduler:
    build: .
    container_name: recommendation-scheduler-prod
    environment:
      - DB_URL=${DB_URL}
      - RETRAIN_INTERVAL_HOURS=${RETRAIN_INTERVAL_HOURS:-24}
    volumes:
      - model_data:/app/model_data
    command: ["python3", "setup.py", "retrain"]
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    depends_on:
      - recommendation-service
    networks:
      - recommendation-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  recommendation-network:
    driver: bridge

volumes:
  model_data:
    driver: local